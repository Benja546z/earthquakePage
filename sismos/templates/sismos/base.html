<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <title>{% block titulo %}Proyecto Sismos{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Estilos personalizados para el menú lateral */
    .menu-opcion {
      font-size: 1.1rem;
      padding: 10px 15px;
      margin-bottom: 8px;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.05); /* Casilla semitransparente */
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      display: block;
      transition: all 0.2s ease-in-out;
    }
    .menu-opcion:hover {
      background-color: rgba(255, 255, 255, 0.15); /* Iluminación en hover */
      color: #ffffff;
      transform: translateX(5px); /* Pequeño desplazamiento */
    }
    .menu-categoria {
      font-size: 1.15rem;
      font-weight: 500;
      color: #ffffff;
    }
  </style>
</head>
<body class="bg-light">
  
  <!-- Barra superior con las 3 rayitas -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral">
        <span class="navbar-toggler-icon"></span>
      </button>
      <span class="navbar-brand mb-0 h1 ms-2">Taller de Visualización de Datos</span>
    </div>
  </nav>

  <!-- Menú Oculto (Offcanvas) -->
  <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
    <div class="offcanvas-header border-bottom border-secondary">
      <h4 class="offcanvas-title fw-bold" id="menuLateralLabel">Menú Principal</h4>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    
    <div class="offcanvas-body">
      <ul class="nav flex-column mt-2">
        <li class="nav-item mb-3">
          <a class="menu-opcion" href="{% url 'index' %}">Inicio</a>
        </li>
        
        <!-- Listados -->
        <li class="nav-item mb-2">
          <a class="nav-link dropdown-toggle menu-categoria" data-bs-toggle="collapse" href="#menuListados" role="button">
            Listados de datos
          </a>
          <div class="collapse mt-2" id="menuListados">
            <ul class="nav flex-column ms-2 pe-3">
              <li><a class="menu-opcion" href="{% url 'listado1' %}">Sismos Globales</a></li>
              <li><a class="menu-opcion" href="{% url 'listado2' %}">Sismos en Chile</a></li>
              <li><a class="menu-opcion" href="{% url 'listado3' %}">Eventos Antrópicos</a></li>
            </ul>
          </div>
        </li>

        <!-- Gráficos -->
        <li class="nav-item mb-2 mt-2">
          <a class="nav-link dropdown-toggle menu-categoria" data-bs-toggle="collapse" href="#menuGraficos" role="button">
            Gráficos
          </a>
          <div class="collapse mt-2" id="menuGraficos">
            <ul class="nav flex-column ms-2 pe-3">
              <li><a class="menu-opcion" href="{% url 'grafico1' %}">Eventos Antrópicos</a></li>
              <li><a class="menu-opcion" href="{% url 'grafico2' %}">Sismos Fuertes vs Leves</a></li>
              <li><a class="menu-opcion" href="{% url 'grafico3' %}">Mapa Tectónico</a></li>
            </ul>
          </div>
        </li>
      </ul>
    </div>
  </div>

  <!-- Área de Contenido Dinámico -->
  <div class="container-fluid">
    <main class="px-md-4 py-4">
      {% block contenido %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
