{% extends 'sismos/base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
  <h1 class="h3 mb-3">{{ titulo }}</h1>
  
  <div class="d-flex justify-content-between align-items-center mb-3">
    <p class="lead mb-0 w-75">{{ explicacion }}</p>
    
    {% if es_grafico_interactivo %}
    <!-- Botón para alternar el mapa, solo visible en el Gráfico 3 -->
    <button id="btnAlternarMapa" class="btn btn-outline-primary shadow-sm" onclick="alternarMapa()">
      Mostrar Mapa de Fondo
    </button>
    {% endif %}
  </div>

  <div class="card shadow-sm">
    <div class="card-body text-center">
      <!-- Imagen principal. Si es interactivo, le asignamos un ID para cambiar su 'src' -->
      <img id="imagenGrafico" src="data:image/png;base64,{{ grafico }}" class="img-fluid rounded" alt="{{ titulo }}">
    </div>
  </div>

  {% if es_grafico_interactivo %}
  <!-- Script para cambiar el src de la imagen al presionar el botón -->
  <script>
    let mostrandoMapa = false;
    const imgElement = document.getElementById('imagenGrafico');
    const btnElement = document.getElementById('btnAlternarMapa');
    
    // Guardamos las cadenas base64 renderizadas por Django en variables de JavaScript
    const srcSinMapa = "data:image/png;base64,{{ grafico }}";
    const srcConMapa = "data:image/png;base64,{{ grafico_mapa }}";

    function alternarMapa() {
      if (!mostrandoMapa) {
        imgElement.src = srcConMapa;
        btnElement.textContent = "Ocultar Mapa de Fondo";
        btnElement.classList.replace("btn-outline-primary", "btn-primary");
      } else {
        imgElement.src = srcSinMapa;
        btnElement.textContent = "Mostrar Mapa de Fondo";
        btnElement.classList.replace("btn-primary", "btn-outline-primary");
      }
      mostrandoMapa = !mostrandoMapa;
    }
  </script>
  {% endif %}
{% endblock %}
